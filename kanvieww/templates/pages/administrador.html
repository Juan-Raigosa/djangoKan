{% extends 'index.html' %}

{% block content %}

<h1 style="display: flex;
        justify-content: center; 
        font-size: 90px;
        margin-top: 22px;
        margin-bottom: 15px;
        color: rgb(212, 212, 255);">
        Tabla de administradores Kanview
      </h1>
<div class="content-table">
  <table class="table table-striped" border="1" width="80%">
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Celular</th>
      <th>Documento</th>
    </tr>
    {% for i in datos %}
    <tr>
      <td>{{ i.id }}</td>
      <td>{{ i.nombre }}</td>
      <td>{{ i.celular }}</td>
      <td>{{ i.documento }}</td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
