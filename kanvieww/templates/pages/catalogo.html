{% extends 'index.html' %}

{% block content %}
<h1 style="display: flex;
        justify-content: center; 
        font-size: 90px;
        margin-top: 22px;
        margin-bottom: 15px;
        color: rgb(212, 212, 255);">
        Tabla de catálogo Kanview
      </h1>
<div class="content-table">
  <table class="table" border="1" width="80%">
    <tr>
      <th>ID</th>
      <th>Categorias</th>
      <th>ID inventario</th>
      <th>ID producto</th>
    </tr>
    {% for i in datos %}
    <tr>
      <td>{{ i.id }}</td>
      <td>{{ i.categorias }}</td>
      <td>{{ i.id_inventario_id }}</td>
      <td>{{ i.id_producto_id }}</td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
